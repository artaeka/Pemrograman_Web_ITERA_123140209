<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan 2 - Posts API</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;background:#fff;color:#222}
body.dark{background:#1b1b1f;color:#eee}
body.dark input,body.dark .post{background:#2a2a30;color:#eee;border-color:#555}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem}
input{width:100%;padding:.5rem;margin:1rem 0;box-sizing:border-box}
.post{border:1px solid #ccc;border-radius:6px;padding:.7rem;margin-bottom:.6rem}
.post h3{margin:0 0 .3rem;font-size:1rem}
.pager{display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:1rem}
button{padding:.4rem .9rem;cursor:pointer}
</style></head><body>
<div class="top"><h1>Daftar Post</h1><button id="btnDark">Mode Gelap</button></div>
<input id="cari" placeholder="Cari berdasarkan title...">
<div id="list">Memuat data...</div>
<div class="pager"><button id="prev">Previous</button><span id="info"></span><button id="next">Next</button></div>
<script>
const PER_PAGE = 10;
let semua = [], hasil = [], halaman = 1;
const $ = (id) => document.getElementById(id);

async function ambilData() {
  try {
    const res = await fetch("https://jsonplaceholder.typicode.com/posts");
    if (!res.ok) throw new Error("Status " + res.status);
    semua = await res.json();
    filter();
  } catch (err) {
    $("list").textContent = "Gagal memuat data: " + err.message;
  }
}

function filter() {
  const kata = $("cari").value.trim().toLowerCase();
  hasil = semua.filter((p) => p.title.toLowerCase().includes(kata));
  halaman = 1;
  render();
}

function render() {
  const totalHal = Math.max(1, Math.ceil(hasil.length / PER_PAGE));
  const awal = (halaman - 1) * PER_PAGE;
  const tampil = hasil.slice(awal, awal + PER_PAGE);
  $("list").innerHTML = "";
  if (tampil.length === 0) $("list").textContent = "Tidak ada post yang cocok.";
  tampil.forEach((p) => {
    const d = document.createElement("div"); d.className = "post";
    const h = document.createElement("h3"); h.textContent = p.title;
    const t = document.createElement("p"); t.textContent = p.body;
    d.append(h, t); $("list").appendChild(d);
  });
  $("info").textContent = `Halaman ${halaman} dari ${totalHal} (${hasil.length} post)`;
  $("prev").disabled = halaman === 1;
  $("next").disabled = halaman === totalHal;
}

$("cari").addEventListener("input", filter);
$("prev").addEventListener("click", () => { halaman--; render(); });
$("next").addEventListener("click", () => { halaman++; render(); });

// Dark mode: toggle class "dark" pada body, simpan pilihan
if (localStorage.getItem("tema") === "dark") document.body.classList.add("dark");
$("btnDark").addEventListener("click", () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("tema", document.body.classList.contains("dark") ? "dark" : "light");
});

ambilData();
</script></body></html>
